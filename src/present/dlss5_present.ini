; Settings of the present hook (version.dll): the engine applied to every
; presented frame of a D3D12 game, in the same frame. This file and
; version.dll go beside the game's executable; the log is dlss5_present.log.

; 0 leaves the game untouched (the swap chain is not hooked at all).
Enabled=1

; The engine and its configuration file (the 24 weight paths, then
; transfer=nvidia, extent=compact, external_controls=1). Full paths.
EngineDll=
EngineConfig=

; The model's working size as a fraction of the frame. 0 picks the largest
; size that keeps the working frame within MaxWorkingPixels; lower is faster
; and softer. The whole frame takes about 13 ms at 1.2 million working
; pixels and 20 ms at 2.1 million on an RX 9070 XT.
WorkingScale=0
MaxWorkingPixels=2100000

; NVIDIA's controls. Intensity is clamped to 1 by the model's own blend.
; Style: 0 default, 1 natural, 2 cinematic. SkinStructure -1 follows
; LocalStructure.
Intensity=1.0
Style=0
LocalStructure=1.0
LocalTone=1.0
SkinStructure=-1
AutoMask=1

; Virtual-key code that switches the effect on and off in game (0x79 = F10,
; 0 = none).
ToggleKey=0x79

; A recording for diagnosis: CaptureKey (0x7A = F11, 0 = none) records
; CaptureFrames consecutive frames (the working-size picture and the engine's
; change) into "<CapturePath>.pseq.<tick>". Empty CapturePath: off.
CapturePath=
CaptureKey=0x7A
CaptureFrames=60
