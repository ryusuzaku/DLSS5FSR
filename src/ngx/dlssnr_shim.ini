; dlssnr_shim.ini -- goes next to nvngx.dll in the game folder.
; All keys optional; these are the defaults.

; 0=error 1=warn 2=info 3=debug
LogLevel=2

; 0 disables everything; Output is left untouched.
Enabled=1

; Neural-render strength. 0 must be a bit-exact passthrough.
TransferStrength=0.0
ColourStrength=0.0

; Fraction of display resolution the model runs at. Main performance lever.
ModelScale=1.0

; 1 runs the encode -> model -> resolve chain over the resampled frame;
; 0 resamples only. Separate from Enabled so the colour pipeline can be
; switched off on its own, which is how a strength-0 regression gets bisected.
NrPasses=1

; 1 runs the model pass through HIP on the ROCm runtime (AMD cards; the
; runtime DLLs must be findable -- next to the game exe or on PATH). Falls
; back to the identity model with one log line when ROCm is absent, so the
; DLL still works on any machine. The HIP answer lags one frame: D3D12
; command lists cannot record fence waits, so the shim proves the previous
; frame executed via a counter before running HIP on its staged input.
HipBackend=1

; Self-test only (dev machine; empty = skipped): with all three set, the
; first successful model run also pushes the REAL QKV weights through the
; rocWMMA FP8 GEMM with a one-hot input and logs a bit-exact checksum.
;   HipWeightsDir = directory containing tensor_052.bin (dlss5-analysis/tensors)
;   HipRocwmmaInc = .../ext/rocWMMA/library/include
;   HipRocInc     = the ROCm include dir (hiprtc's implicit path lacks it)
HipWeightsDir=
HipRocwmmaInc=
HipRocInc=

; The scene value the game's tonemapper calls white. Everything the encode
; does is relative to it, so getting it wrong is not subtle: the proxy is
; crushed or clipped and the model is shown a picture that does not exist.
WhitePoint=1.0

; Which proxy curve the encode uses. The proxy is what the model is shown; it
; has to be bounded (RGBA8) and display-referred while the game hands us
; scene-linear HDR, and a curve that flattens highlights makes the model see a
; flat white field whose blown pixels flip between frames.
;   0  soft knee  -- the old curve, kept so the two can be compared
;   1  hybrid     -- identity through the midtones, reversible roll above
;   2  scale and encode only (default) -- the resolve restores the headroom
; See NR_PROXY_CURVE.md for the formulas.
ProxyMode=2

; Ceiling on how far a pixel may be brightened. The transfer is a ratio and a
; ratio against a near-black pixel is unbounded without one.
MaxRatio=4.0

; 1 = the game's buffer is already display-encoded, so the encode is a copy.
; Some games hand DLSS a frame that has been through their own tonemapper,
; and converting one that needs no conversion is pure damage.
Passthrough=0

; 0 off, 1 the proxy the model is shown, 2 the model's answer, 3 the
; difference between them, amplified and centred on grey.
DebugView=0

; Diagnostic fixed-image preview only. Export a validated candidate frame with
; tools/export_candidate_preview.py, set its absolute .bin path here, and use
; DebugView=2. This verifies the game's model-texture bridge; it does not run
; the full candidate network on the current scene. Empty = disabled.
CandidatePreviewPath=

; Diagnostic one-shot capture of the completed staged model input (raw proxy
; bytes and format metadata). Set an absolute .bin path in an existing folder.
; Use tools/prepare_candidate_input.py to make a 256x256 center-crop input.
; Empty = disabled; normal rendering is unchanged.
CandidateInputCapturePath=
; 1 waits for <CandidateInputCapturePath>.go to exist. The shim deletes that
; trigger after writing the capture; useful for capturing a game scene instead
; of the first menu frame. 0 captures the first completed frame.
CandidateInputCaptureTrigger=0
; Optional 256x256 linear RGB f32 generated by HIP from the SAME completed
; staged proxy frame as CandidateInputCapturePath. Diagnostic only; the
; model output is unchanged. Set an absolute writable .f32 path.
CandidateInputGpuPath=

; Debug dumps. Writes nr_<n>_in.bmp / nr_<n>_out.bmp next to the log.
DumpFrames=0
; 0 = dump the first frame only; n>0 = dump every n-th evaluate.
DumpEvery=0
; Where the dumps go. The shim does NOT create this directory -- _wfopen()
; just fails and the run silently writes nothing, so make it yourself first
; (ab_arm_*.bat do). Empty = the module directory / the app's data path.
DumpDir=

; How the FFN/projection weights are read out of the tensor blobs.
;   1  out-major [out][in]  -- the default, and the PTX-ISA .col reading (S148)
;   0  in-major  [in][out]  -- the legacy reading
;   2  TINLAYOUT, W1/W2 ONLY: the two regions S116 measured the production
;      cubin loading as m16n8k32.e4m3 B fragments, un-permuted on the host
;      and served dense out-major. qkv and projections stay dense.
;   3  TINLAYOUT over every mma weight region (S223e): as 2 plus the qkv
;      ([32][96] per k-half/head, k-major) and the [C][C] / [2C][C] width
;      projections. Those geometries are DERIVED from the kernels that read
;      them, not measured like W1/W2 -- so 2 and 3 are a pair: if they
;      disagree, the derived part is wrong and 2 is the honest reading.
;   4  TINLAYOUT in THEIR bit order (S229). Our map (tools/wload_map.py) and the
;      reference port's (derive_native_ffn_layout.py) are both clean bit
;      permutations of the same positions and they DISAGREE -- 1024 of 16384
;      positions agree, and the correspondence is a swap of bits 0/1 plus a
;      four-cycle 3 -> 8 -> 7 -> 6 -> 3. Theirs is asserted exact against
;      connectivity recovered from the real C=64/C=128 cubins; ours was
;      hand-derived from PTX. Their rules are published for C>=64 only, so the
;      C=32 stages fall back to our map, and the log says which was applied.
HipFfnTranspose=1
